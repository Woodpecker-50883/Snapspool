name: Snapspool

options:
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"

targets:
  Snapspool:
    type: application
    platform: macOS
    sources:
      - path: Sources/SnapspoolApp.swift
      - path: Resources
    dependencies:
      - target: SnapspoolTestable
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.snapspool.Snapspool
        PRODUCT_NAME: Snapspool
        PRODUCT_MODULE_NAME: SnapspoolApp
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Snapspool.entitlements
        ENABLE_APP_SANDBOX: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  SnapspoolTestable:
    type: framework
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - SnapspoolApp.swift
    settings:
      base:
        PRODUCT_NAME: Snapspool
        PRODUCT_MODULE_NAME: Snapspool
        GENERATE_INFOPLIST_FILE: YES

  SnapspoolTests:
    type: bundle.unit-test
    platform: macOS
    hostApplication: Snapspool
    sources:
      - path: Tests
      - path: Resources
    dependencies:
      - target: SnapspoolTestable
      - target: Snapspool
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.snapspool.SnapspoolTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Snapspool.app/Contents/MacOS/Snapspool

schemes:
  Snapspool:
    build:
      targets:
        Snapspool: all
        SnapspoolTests: [test]
    test:
      targets:
        - SnapspoolTests
