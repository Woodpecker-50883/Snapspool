name: Snapspool

options:
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"

targets:
  Snapspool:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.snapspool.Snapspool
        PRODUCT_NAME: Snapspool
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Snapspool.entitlements
        ENABLE_APP_SANDBOX: YES
        COMBINE_HIDPI_IMAGES: YES

  SnapspoolTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Snapspool
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.snapspool.SnapspoolTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Snapspool:
    build:
      targets:
        Snapspool: all
        SnapspoolTests: [test]
    test:
      targets:
        - SnapspoolTests
